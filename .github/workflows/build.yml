name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build-type: Debug
          - os: ubuntu-latest
            build-type: Release
          - os: ubuntu-22.04
            build-type: Release
          - os: windows-latest
            build-type: Debug
          - os: windows-latest
            build-type: Release
          - os: macos-latest
            build-type: Debug
          - os: macos-latest
            build-type: Release

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@v3.29

      - name: Setup vcpkg
        uses: friendlyanon/setup-vcpkg@v1
        with:
          committish: 501db0f17ef6df184fcdbfbe0f87cde2313b6ab1

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
        shell: bash

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }}
        shell: bash

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -C ${{ matrix.build-type }}
        shell: bash
